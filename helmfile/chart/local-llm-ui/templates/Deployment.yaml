apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-llm-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-llm-ui
  template:
    metadata:
      labels:
        app: local-llm-ui
    spec:
      nodeSelector:
        {}
      affinity:
        {}
      tolerations:
        []
      containers:
        - name: open-webui
          image: "ghcr.io/open-webui/open-webui:main"
          imagePullPolicy: IfNotPresent
          env:
            - name: OLLAMA_BASE_URL
              value: "http://local-llm.local-llm.svc.cluster.local:11434"
            - name: WEBUI_AUTH
              value: "False"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi

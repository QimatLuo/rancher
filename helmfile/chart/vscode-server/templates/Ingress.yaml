apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vscode-server
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
spec:
  ingressClassName: "traefik"
  rules:
    - host: "vscode.ihanastudio.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vscode-server
                port:
                  number: 8080
  tls:
    - hosts:
        - "vscode.ihanastudio.com"
      secretName: "vscode-server-tls"

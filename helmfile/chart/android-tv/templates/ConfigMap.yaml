---
apiVersion: v1
kind: ConfigMap
metadata:
  name: android
data:
{{ (.Files.Glob ".android/*").AsConfig | indent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: src
data:
{{- range $path, $_ := .Files.Glob "src/*.py" }}
  {{ $path | trimPrefix "src/" | replace "/" "_" }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- range $path, $_ := .Files.Glob "src/*.sh" }}
  {{ $path | trimPrefix "src/" | replace "/" "_" }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- range $path, $_ := .Files.Glob "src/*.html" }}
  {{ $path | trimPrefix "src/" | replace "/" "_" }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}

{{- if .Values.internalRegistry.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: internal-registry
  template:
    metadata:
      labels:
        app: internal-registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          volumeMounts:
            - name: registry-data
              mountPath: /var/lib/registry
      volumes:
        - name: registry-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: internal-registry
spec:
  type: NodePort
  selector:
    app: internal-registry
  ports:
    - name: registry
      port: 5000
      targetPort: 5000
      nodePort: {{ .Values.internalRegistry.nodePort }}
{{- end }}

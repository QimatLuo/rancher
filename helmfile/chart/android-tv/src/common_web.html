<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>__PAGE_TITLE__</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; }
    body { display: grid; place-items: center; }
    #stream-wrap { position: relative; display: inline-block; max-width: 100%; max-height: 100%; }
    img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
    #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  </style>
</head>
<body>
  <div id="stream-wrap">
    <img id="live-stream" alt="live stream" />
    <canvas id="overlay"></canvas>
  </div>
  <script>
    const img = document.getElementById("live-stream");
    const overlayCanvas = document.getElementById("overlay");
    const overlayCtx = overlayCanvas.getContext("2d");
    const sampleCanvas = document.createElement("canvas");
    const sampleCtx = sampleCanvas.getContext("2d", { willReadFrequently: true });
    const streamPath = "/stream.mjpg";
    const overlayWsPath = "/overlay.ws";
    const overlayEnabled = __OVERLAY_ENABLED__;
    const frameCheckMs = 1500;
    const stallReconnectMs = 45000;
    const errorRetryMs = 1200;

    let frameCheckTimer = null;
    let retryTimer = null;
    let overlaySocket = null;
    let overlayReconnectTimer = null;
    let lastFrameSignature = "";
    let lastFrameChangedAt = Date.now();
    let overlayData = null;

    const toHex = (value) => value.toString(16).padStart(2, "0").toUpperCase();

    const reconnectStream = () => {
      const ts = Date.now()
      img.src = `${streamPath}?ts=${ts}`;
      console.log(ts)
    };

    const sampleFrameSignature = () => {
      const naturalWidth = img.naturalWidth || 0;
      const naturalHeight = img.naturalHeight || 0;

      if (!sampleCtx || naturalWidth <= 0 || naturalHeight <= 0) {
        return "";
      }

      const sampleWidth = 32;
      const sampleHeight = 18;
      sampleCanvas.width = sampleWidth;
      sampleCanvas.height = sampleHeight;

      try {
        sampleCtx.drawImage(img, 0, 0, sampleWidth, sampleHeight);
        const pixels = sampleCtx.getImageData(0, 0, sampleWidth, sampleHeight).data;
        let sum = 0;

        for (let i = 0; i < pixels.length; i += 4) {
          sum += pixels[i] * 3 + pixels[i + 1] * 4 + pixels[i + 2];
        }

        return `${naturalWidth}x${naturalHeight}:${Math.round(sum / pixels.length)}`;
      } catch (error) {
        return "";
      }
    };

    const monitorFrameChanges = () => {
      if (document.hidden) {
        return;
      }

      const signature = sampleFrameSignature();
      const now = Date.now();

      if (!signature) {
        return;
      }

      if (signature !== lastFrameSignature) {
        lastFrameSignature = signature;
        lastFrameChangedAt = now;
        return;
      }

      if (now - lastFrameChangedAt >= stallReconnectMs) {
        lastFrameChangedAt = now;
        reconnectStream();
      }
    };

    const startFrameMonitor = () => {
      if (frameCheckTimer !== null) {
        clearInterval(frameCheckTimer);
      }
      frameCheckTimer = setInterval(monitorFrameChanges, frameCheckMs);
    };

    const syncOverlayCanvasSize = () => {
      const width = Math.max(0, img.clientWidth || 0);
      const height = Math.max(0, img.clientHeight || 0);

      if (!overlayCtx || width <= 0 || height <= 0) {
        return;
      }

      if (overlayCanvas.width !== width) {
        overlayCanvas.width = width;
      }
      if (overlayCanvas.height !== height) {
        overlayCanvas.height = height;
      }
    };

    const drawOverlayText = (text, x, y, color, font = "bold 18px monospace") => {
      if (!overlayCtx) {
        return;
      }
      overlayCtx.font = font;
      overlayCtx.lineWidth = 4;
      overlayCtx.strokeStyle = "rgba(0,0,0,0.75)";
      overlayCtx.strokeText(text, x, y);
      overlayCtx.fillStyle = color;
      overlayCtx.fillText(text, x, y);
    };

    const drawGenericOverlay = (sx, sy) => {
      const shapes = Array.isArray(overlayData.shapes) ? overlayData.shapes : [];
      const texts = Array.isArray(overlayData.texts) ? overlayData.texts : [];

      for (const shape of shapes) {
        if (!shape || typeof shape !== "object") {
          continue;
        }

        const color = typeof shape.color === "string" ? shape.color : "rgb(0,255,0)";
        const width = Number.isFinite(shape.width) ? Math.max(1, Number(shape.width)) : 2;
        const fill = Boolean(shape.fill);

        overlayCtx.strokeStyle = color;
        overlayCtx.fillStyle = color;
        overlayCtx.lineWidth = width;

        if (shape.type === "rect") {
          const x1 = Number(shape.x1 || 0) * sx;
          const y1 = Number(shape.y1 || 0) * sy;
          const x2 = Number(shape.x2 || 0) * sx;
          const y2 = Number(shape.y2 || 0) * sy;
          const rw = Math.max(1, x2 - x1);
          const rh = Math.max(1, y2 - y1);
          if (fill) {
            overlayCtx.fillRect(x1, y1, rw, rh);
          } else {
            overlayCtx.strokeRect(x1, y1, rw, rh);
          }
          continue;
        }

        if (shape.type === "line") {
          overlayCtx.beginPath();
          overlayCtx.moveTo(Number(shape.x1 || 0) * sx, Number(shape.y1 || 0) * sy);
          overlayCtx.lineTo(Number(shape.x2 || 0) * sx, Number(shape.y2 || 0) * sy);
          overlayCtx.stroke();
          continue;
        }

        if (shape.type === "circle") {
          const cx = Number(shape.x || 0) * sx;
          const cy = Number(shape.y || 0) * sy;
          const radius = Math.max(1, Number(shape.r || 0) * (sx + sy) * 0.5);
          overlayCtx.beginPath();
          overlayCtx.arc(cx, cy, radius, 0, Math.PI * 2);
          if (fill) {
            overlayCtx.fill();
          } else {
            overlayCtx.stroke();
          }
          continue;
        }

        if (shape.type === "polyline") {
          const points = Array.isArray(shape.points) ? shape.points : [];
          if (points.length < 2) {
            continue;
          }
          overlayCtx.beginPath();
          overlayCtx.moveTo(Number(points[0][0] || 0) * sx, Number(points[0][1] || 0) * sy);
          for (let i = 1; i < points.length; i += 1) {
            overlayCtx.lineTo(Number(points[i][0] || 0) * sx, Number(points[i][1] || 0) * sy);
          }
          if (Boolean(shape.closed)) {
            overlayCtx.closePath();
          }
          overlayCtx.stroke();
          continue;
        }
      }

      for (const item of texts) {
        if (!item || typeof item !== "object") {
          continue;
        }
        drawOverlayText(
          String(item.text || ""),
          Number(item.x || 0) * sx,
          Number(item.y || 0) * sy,
          typeof item.color === "string" ? item.color : "rgb(255,255,255)",
          typeof item.font === "string" ? item.font : "bold 14px monospace",
        );
      }
    };

    const drawAdbEvents = (sx, sy, cw) => {
      const events = Array.isArray(overlayData.adb_events) ? overlayData.adb_events : [];
      if (events.length === 0 || !overlayCtx) {
        return;
      }

      const lines = [];
      for (const item of events.slice(-8).reverse()) {
        if (!item || typeof item !== "object") {
          continue;
        }

        const ageSec = Number(item.age_sec || 0);
        const alpha = Math.max(0, 1 - ageSec / 3.0);
        if (alpha <= 0.01) {
          continue;
        }

        const kind = String(item.kind || "adb");
        const ok = item.ok === false ? "FAIL" : "OK";

        if ((kind === "tap" || kind === "swipe") && Number.isFinite(item.frame_x) && Number.isFinite(item.frame_y)) {
          const x = Number(item.frame_x) * sx;
          const y = Number(item.frame_y) * sy;
          overlayCtx.save();
          overlayCtx.globalAlpha = alpha;
          overlayCtx.strokeStyle = kind === "tap" ? "rgb(255,120,80)" : "rgb(80,220,255)";
          overlayCtx.lineWidth = 2;
          overlayCtx.beginPath();
          overlayCtx.arc(x, y, 10 + ageSec * 36, 0, Math.PI * 2);
          overlayCtx.stroke();
          overlayCtx.fillStyle = item.ok === false ? "rgb(255,80,80)" : "rgb(0,255,160)";
          overlayCtx.beginPath();
          overlayCtx.arc(x, y, 3, 0, Math.PI * 2);
          overlayCtx.fill();
          overlayCtx.restore();
        }

        if (kind === "tap") {
          lines.push(`TAP ${ok} (${Number(item.frame_x || 0)},${Number(item.frame_y || 0)})`);
        } else if (kind === "swipe") {
          lines.push(`SWIPE ${ok} (${Number(item.frame_x || 0)},${Number(item.frame_y || 0)}) ${Number(item.duration_ms || 0)}ms`);
        } else if (kind === "keyevent") {
          lines.push(`KEY ${ok} ${String(item.code || "")}`);
        } else if (kind === "text") {
          lines.push(`TEXT ${ok} ${String(item.text || "")}`);
        }
      }

      const panelX = Math.max(12, cw - 520);
      let lineY = 28;
      for (const line of lines.slice(0, 6)) {
        drawOverlayText(line, panelX, lineY, "rgb(255,255,255)", "bold 12px monospace");
        lineY += 18;
      }
    };

    const drawOverlay = () => {
      requestAnimationFrame(drawOverlay);
      if (!overlayCtx || !overlayEnabled) {
        return;
      }

      syncOverlayCanvasSize();
      const cw = overlayCanvas.width;
      const ch = overlayCanvas.height;
      overlayCtx.clearRect(0, 0, cw, ch);

      const naturalWidth = img.naturalWidth || 0;
      const naturalHeight = img.naturalHeight || 0;
      if (!overlayData || naturalWidth <= 0 || naturalHeight <= 0 || cw <= 0 || ch <= 0) {
        return;
      }

      const sx = cw / naturalWidth;
      const sy = ch / naturalHeight;

      const hasGeneric = Array.isArray(overlayData.shapes) || Array.isArray(overlayData.texts);
      if (hasGeneric) {
        drawGenericOverlay(sx, sy);
        drawAdbEvents(sx, sy, cw);
        return;
      }

      if (overlayData.action_status) {
        drawOverlayText(String(overlayData.action_status), 16, 86, "rgb(255,165,0)");
      }

      if (overlayData.roi && overlayData.roi.length === 4) {
        const [x1, y1, x2, y2] = overlayData.roi;
        overlayCtx.strokeStyle = "rgb(255,200,0)";
        overlayCtx.lineWidth = 2;
        overlayCtx.strokeRect(x1 * sx, y1 * sy, Math.max(1, (x2 - x1) * sx), Math.max(1, (y2 - y1) * sy));
        drawOverlayText("ROI", x1 * sx + 4, Math.max(16, y1 * sy - 6), "rgb(255,200,0)", "bold 14px monospace");
      }

      const candidates = Array.isArray(overlayData.candidates) ? overlayData.candidates : [];
      for (let i = 0; i < Math.min(3, candidates.length); i += 1) {
        const item = candidates[i];
        if (!Array.isArray(item) || item.length < 5) {
          continue;
        }
        const [x1, y1, x2, y2, length] = item;
        const isTop = i === 0;
        const color = isTop ? "rgb(255,0,0)" : "rgb(255,180,0)";
        overlayCtx.strokeStyle = color;
        overlayCtx.lineWidth = isTop ? 3 : 2;
        overlayCtx.beginPath();
        overlayCtx.moveTo(x1 * sx, y1 * sy);
        overlayCtx.lineTo(x2 * sx, y2 * sy);
        overlayCtx.stroke();
        drawOverlayText(`L${i + 1}:${Number(length).toFixed(1)}`, x1 * sx + 4, Math.max(16, y1 * sy - 6), color, "bold 13px monospace");
      }

      const samplePoints = Array.isArray(overlayData.sample_points) ? overlayData.sample_points : [];
      for (const point of samplePoints) {
        if (!point || typeof point !== "object") {
          continue;
        }
        const px = Number(point.x || 0) * sx;
        const py = Number(point.y || 0) * sy;
        const color = typeof point.color === "string" ? point.color : "rgb(0,255,255)";
        overlayCtx.strokeStyle = color;
        overlayCtx.lineWidth = 2;
        overlayCtx.beginPath();
        overlayCtx.moveTo(px - 8, py);
        overlayCtx.lineTo(px + 8, py);
        overlayCtx.moveTo(px, py - 8);
        overlayCtx.lineTo(px, py + 8);
        overlayCtx.stroke();
        drawOverlayText(String(point.label || "sample"), px + 10, Math.max(16, py - 10), color, "bold 12px monospace");
      }

      const countdowns = Array.isArray(overlayData.countdowns) ? overlayData.countdowns : [];
      for (const item of countdowns) {
        if (!item || typeof item !== "object") {
          continue;
        }
        const px = Number(item.x || 0) * sx;
        const py = Number(item.y || 0) * sy;
        const color = typeof item.color === "string" ? item.color : "rgb(255,255,255)";
        const remain = Math.max(0, Number(item.remaining_sec || 0));
        const label = `${String(item.label || "wait")}: ${remain.toFixed(1)}s`;
        drawOverlayText(label, px + 10, py + 22, color, "bold 13px monospace");
      }

      drawAdbEvents(sx, sy, cw);
    };

    const scheduleOverlayReconnect = (delayMs = 800) => {
      if (!overlayEnabled) {
        return;
      }
      if (overlayReconnectTimer !== null) {
        return;
      }
      overlayReconnectTimer = setTimeout(() => {
        overlayReconnectTimer = null;
        startOverlayWebSocket();
      }, delayMs);
    };

    const startOverlayWebSocket = () => {
      if (!overlayEnabled) {
        return;
      }

      if (overlaySocket !== null && (overlaySocket.readyState === WebSocket.OPEN || overlaySocket.readyState === WebSocket.CONNECTING)) {
        return;
      }

      const protocol = window.location.protocol === "https:" ? "wss" : "ws";
      const wsUrl = `${protocol}://${window.location.host}${overlayWsPath}`;
      const ws = new WebSocket(wsUrl);
      overlaySocket = ws;

      ws.addEventListener("message", (event) => {
        try {
          overlayData = JSON.parse(event.data);
        } catch (_error) {
        }
      });

      ws.addEventListener("close", () => {
        if (overlaySocket === ws) {
          overlaySocket = null;
        }
        scheduleOverlayReconnect(1000);
      });

      ws.addEventListener("error", () => {
        try {
          ws.close();
        } catch (_error) {
        }
      });
    };

    img.addEventListener("error", () => {
      if (retryTimer !== null) {
        return;
      }
      retryTimer = setTimeout(() => {
        retryTimer = null;
        reconnectStream();
      }, errorRetryMs);
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        return;
      }
      lastFrameChangedAt = Date.now();
      reconnectStream();
    });

    window.addEventListener("focus", () => {
      lastFrameChangedAt = Date.now();
      reconnectStream();
    });

    img.addEventListener("click", (event) => {
      const rect = img.getBoundingClientRect();
      const displayX = event.clientX - rect.left;
      const displayY = event.clientY - rect.top;

      const naturalWidth = img.naturalWidth || 0;
      const naturalHeight = img.naturalHeight || 0;

      if (!sampleCtx || naturalWidth <= 0 || naturalHeight <= 0 || rect.width <= 0 || rect.height <= 0) {
        console.log(sampleCtx, naturalWidth, naturalHeight, rect.width, rect.height);
        return;
      }

      const scale = Math.min(rect.width / naturalWidth, rect.height / naturalHeight);
      const renderedWidth = naturalWidth * scale;
      const renderedHeight = naturalHeight * scale;
      const offsetX = (rect.width - renderedWidth) / 2;
      const offsetY = (rect.height - renderedHeight) / 2;

      const imageX = Math.min(
        naturalWidth - 1,
        Math.max(0, Math.round(((displayX - offsetX) / renderedWidth) * naturalWidth)),
      );
      const imageY = Math.min(
        naturalHeight - 1,
        Math.max(0, Math.round(((displayY - offsetY) / renderedHeight) * naturalHeight)),
      );

      sampleCanvas.width = naturalWidth;
      sampleCanvas.height = naturalHeight;

      try {
        sampleCtx.drawImage(img, 0, 0, naturalWidth, naturalHeight);
        const pixel = sampleCtx.getImageData(imageX, imageY, 1, 1).data;
        const color = "#" + toHex(pixel[0]) + toHex(pixel[1]) + toHex(pixel[2]);
        document.body.style.background = color;
        console.log(color + " " + imageX + ", " + imageY);
      } catch (error) {
        console.error(error);
      }
    });

    img.addEventListener("load", syncOverlayCanvasSize);
    window.addEventListener("resize", syncOverlayCanvasSize);

    reconnectStream();
    startFrameMonitor();
    startOverlayWebSocket();
    drawOverlay();
  </script>
</body>
</html>

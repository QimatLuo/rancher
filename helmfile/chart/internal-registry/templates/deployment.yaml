apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-registry
  labels:
    app.kubernetes.io/name: internal-registry
    app.kubernetes.io/component: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: internal-registry
      app.kubernetes.io/component: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: internal-registry
        app.kubernetes.io/component: registry
    spec:
      containers:
        - name: registry
          image: "registry:2"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: registry
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          volumeMounts:
            - name: registry-data
              mountPath: /var/lib/registry
          resources: {}
      volumes:
        - name: registry-data
          persistentVolumeClaim:
            claimName: internal-registry-data
